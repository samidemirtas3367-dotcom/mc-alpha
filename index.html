<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çubuk Kraker Avcısı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Kaydırma çubuklarını gizle */
            background-color: #ffeaa7; /* Açık sarı, iştah açıcı bir arka plan */
            font-family: 'Comic Sans MS', cursive, sans-serif;
            user-select: none; /* Metin seçimini engelle */
        }

        #gameArea {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 28px;
            font-weight: bold;
            color: #d35400;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .kraker {
            position: absolute;
            width: 18px;
            height: 120px;
            background: linear-gradient(to right, #f39c12, #e67e22, #f39c12);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            /* Üzerindeki tuz tanecikleri efekti */
            background-image: radial-gradient(white 15%, transparent 16%);
            background-size: 8px 15px;
        }

        .kraker:active {
            transform: scale(0.9);
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #c0392b;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 20;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 24px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <div id="gameArea">
        <div id="ui">
            <div>Puan: <span id="score">0</span></div>
            <div style="font-size: 20px;">Kaçanlar: <span id="missed">0</span> / 5</div>
        </div>
        
        <div id="gameOver">
            <div>Oyun Bitti!</div>
            <div style="font-size: 24px; margin-top: 10px;">Toplam <span id="finalScore"></span> kraker yedin.</div>
            <button onclick="startGame()">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        let score = 0;
        let missed = 0;
        let gameInterval;
        let difficultyInterval;
        let spawnRate = 1200; // Başlangıçta kraker çıkma hızı
        let isGameOver = false;

        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('score');
        const missedDisplay = document.getElementById('missed');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');

        function startGame() {
            // Değerleri sıfırla
            score = 0;
            missed = 0;
            spawnRate = 1200;
            isGameOver = false;
            
            scoreDisplay.innerText = score;
            missedDisplay.innerText = missed;
            gameOverScreen.style.display = 'none';
            
            // Ekrandaki eski krakerleri temizle
            document.querySelectorAll('.kraker').forEach(k => k.remove());

            // Oyun döngülerini başlat
            gameInterval = setTimeout(createKraker, spawnRate);
            
            // Her 5 saniyede bir oyunu zorlaştır
            difficultyInterval = setInterval(() => {
                if(spawnRate > 400) spawnRate -= 100;
            }, 5000);
        }

        function createKraker() {
            if(isGameOver) return;

            const kraker = document.createElement('div');
            kraker.classList.add('kraker');
            
            // Rastgele yatay pozisyon
            const maxX = window.innerWidth - 30;
            kraker.style.left = Math.floor(Math.random() * maxX) + 'px';
            kraker.style.top = '-130px'; // Ekranın üstünden başla

            // Tıklanınca (Yenince)
            kraker.addEventListener('mousedown', function() {
                if(isGameOver) return;
                
                score += 10;
                scoreDisplay.innerText = score;
                
                // Kıtır efekti (Görsel)
                this.style.height = "20px";
                this.style.background = "none";
                this.style.boxShadow = "none";
                this.innerText = "💥";
                
                // Animasyonu durdur ve sil
                clearInterval(this.fallInterval);
                setTimeout(() => this.remove(), 150);
            });

            // Mobil cihazlar için dokunma desteği
            kraker.addEventListener('touchstart', function(e) {
                e.preventDefault(); // Ekranın kaymasını engelle
                let event = new MouseEvent('mousedown');
                this.dispatchEvent(event);
            });

            gameArea.appendChild(kraker);

            // Düşme animasyonu
            let pos = -130;
            let fallSpeed = 3 + Math.random() * 4; // Rastgele düşme hızı

            kraker.fallInterval = setInterval(() => {
                if(isGameOver) {
                    clearInterval(kraker.fallInterval);
                    return;
                }

                pos += fallSpeed;
                kraker.style.top = pos + 'px';

                // Eğer kraker yere düşerse
                if (pos > window.innerHeight) {
                    clearInterval(kraker.fallInterval);
                    kraker.remove();
                    
                    missed++;
                    missedDisplay.innerText = missed;
                    
                    if(missed >= 5) {
                        endGame();
                    }
                }
            }, 20);

            // Sonraki krakeri çağır
            if(!isGameOver) {
                gameInterval = setTimeout(createKraker, spawnRate);
            }
        }

        function endGame() {
            isGameOver = true;
            clearTimeout(gameInterval);
            clearInterval(difficultyInterval);
            
            finalScoreDisplay.innerText = (score / 10); // Yenilen kraker sayısı
            gameOverScreen.style.display = 'block';
        }

        // Oyunu ilk açılışta başlat
        startGame();
    </script>
</body>
</html>
