            <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemek Avcısı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffeaa7;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            user-select: none;
        }

        /* Menü Ekranları */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 234, 167, 0.95);
            z-index: 50;
        }

        h1 {
            font-size: 60px;
            color: #d35400;
            margin-bottom: 10px;
            text-shadow: 2px 2px white;
            text-align: center;
        }

        h2 { color: #2c3e50; }

        .btn {
            margin: 10px;
            padding: 15px 30px;
            font-size: 24px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
            font-family: inherit;
        }

        .btn:hover { background-color: #d35400; transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        
        .btn-green { background-color: #27ae60; }
        .btn-green:hover { background-color: #2ecc71; }

        /* Yemek Seçim Butonları */
        .food-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .food-btn {
            font-size: 40px;
            padding: 10px 20px;
            background: white;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
        }

        .food-btn.selected {
            border-color: #e74c3c;
            background-color: #fad390;
        }

        /* Oyun İçi Arayüz */
        #gameArea { display: none; width: 100vw; height: 100vh; position: relative; }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: white;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Düşen Yemekler */
        .food-item {
            position: absolute;
            font-size: 60px; /* Yemeklerin büyüklüğü */
            cursor: pointer;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        .food-item:active { transform: scale(0.8); }

    </style>
</head>
<body>

    <div id="mainMenu" class="screen">
        <h1>🍔 Yemek Avcısı 🌯</h1>
        <p style="font-size: 20px; color: #555;">Yere düşürmeden hepsini ye!</p>
        
        <div class="food-grid">
            <button class="food-btn selected" onclick="selectFood('hamburger', this)">🍔</button>
            <button class="food-btn" onclick="selectFood('durum', this)">🌯</button>
            <button class="food-btn" onclick="selectFood('kraker', this)">🥨</button>
            <button class="food-btn" onclick="selectFood('pizza', this)">🍕</button>
        </div>

        <button class="btn btn-green" onclick="startGame()" style="font-size: 30px; padding: 20px 50px;">BAŞLA</button>
        <button class="btn" onclick="showScreen('settingsMenu')">⚙️ Ayarlar</button>
    </div>

    <div id="settingsMenu" class="screen" style="display: none;">
        <h2>⚙️ Oyun Ayarları</h2>
        <h3 style="margin-bottom: 5px;">Zorluk Seviyesi:</h3>
        <div style="margin-bottom: 30px;">
            <button class="btn" onclick="setDifficulty('kolay')">Kolay</button>
            <button class="btn btn-green" onclick="setDifficulty('normal')">Normal</button>
            <button class="btn" onclick="setDifficulty('zor')" style="background-color: #c0392b;">Zor</button>
        </div>
        <p>Mevcut Zorluk: <strong id="diffText">Normal</strong></p>
        <button class="btn" onclick="showScreen('mainMenu')" style="margin-top: 40px;">⬅️ Ana Menüye Dön</button>
    </div>

    <div id="gameOver" class="screen" style="display: none; background-color: rgba(255,255,255,0.9);">
        <h1 style="color: #c0392b;">Oyun Bitti!</h1>
        <div style="font-size: 30px; margin: 20px 0;">Toplam <span id="finalScore" style="font-weight:bold; color:#e67e22;"></span> yedin.</div>
        <button class="btn btn-green" onclick="startGame()">🔄 Tekrar Oyna</button>
        <button class="btn" onclick="backToMenu()">🏠 Menüye Dön</button>
    </div>

    <div id="gameArea">
        <div id="ui">
            <div>Skor: <span id="score">0</span></div>
            <div style="font-size: 18px; color:#e74c3c;">Kaçan: <span id="missed">0</span> / 5</div>
        </div>
    </div>

    <script>
        // Oyun Değişkenleri
        let score = 0;
        let missed = 0;
        let gameInterval;
        let difficultyInterval;
        let isGameOver = false;
        
        // Ayarlar
        let currentEmoji = '🍔';
        let baseSpawnRate = 1200; 
        let currentSpawnRate = 1200;
        let speedMultiplier = 1;

        // Ekranları Yönetme Fonksiyonu
        function showScreen(screenId) {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('settingsMenu').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('gameArea').style.display = 'none';
            
            document.getElementById(screenId).style.display = 'flex';
        }

        // Yemek Seçimi
        const foods = {
            'hamburger': '🍔',
            'durum': '🌯',
            'kraker': '🥨',
            'pizza': '🍕'
        };

        function selectFood(foodKey, btnElement) {
            currentEmoji = foods[foodKey];
            
            // Butonların seçim efektini güncelle
            document.querySelectorAll('.food-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        // Zorluk Ayarı
        function setDifficulty(level) {
            const diffText = document.getElementById('diffText');
            if (level === 'kolay') {
                baseSpawnRate = 1600;
                speedMultiplier = 0.7;
                diffText.innerText = "Kolay";
            } else if (level === 'normal') {
                baseSpawnRate = 1200;
                speedMultiplier = 1;
                diffText.innerText = "Normal";
            } else if (level === 'zor') {
                baseSpawnRate = 800;
                speedMultiplier = 1.5;
                diffText.innerText = "Zor";
            }
        }

        // Oyunu Başlat
        function startGame() {
            showScreen('gameArea'); // Oyun alanını göster
            document.getElementById('gameArea').style.display = 'block'; // Flex yerine block kullanıyoruz
            
            // Değerleri sıfırla
            score = 0;
            missed = 0;
            currentSpawnRate = baseSpawnRate;
            isGameOver = false;
            
            document.getElementById('score').innerText = score;
            document.getElementById('missed').innerText = missed;
            
            // Eski yemekleri temizle
            document.querySelectorAll('.food-item').forEach(item => item.remove());

            // Oyun döngüleri
            createFood();
            
            // Zamanla hızlanma
            difficultyInterval = setInterval(() => {
                if(currentSpawnRate > 400) currentSpawnRate -= 100;
            }, 5000);
        }

        // Yemek Oluşturma
        function createFood() {
            if(isGameOver) return;

            const food = document.createElement('div');
            food.classList.add('food-item');
            food.innerText = currentEmoji; // Seçilen emojiyi koy
            
            const maxX = window.innerWidth - 60; // Ekrandan taşmaması için
            food.style.left = Math.floor(Math.random() * maxX) + 'px';
            food.style.top = '-80px'; 

            // Yemeğe Tıklama
            food.addEventListener('mousedown', function() {
                if(isGameOver) return;
                
                score += 1;
                document.getElementById('score').innerText = score;
                
                this.innerText = "💥"; // Yenilme efekti
                clearInterval(this.fallInterval);
                setTimeout(() => this.remove(), 150);
            });

            // Mobil Dokunma
            food.addEventListener('touchstart', function(e) {
                e.preventDefault();
                let event = new MouseEvent('mousedown');
                this.dispatchEvent(event);
            });

            document.getElementById('gameArea').appendChild(food);

            // Düşme Animasyonu
            let pos = -80;
            let fallSpeed = (3 + Math.random() * 3) * speedMultiplier;

            food.fallInterval = setInterval(() => {
                if(isGameOver) {
                    clearInterval(food.fallInterval);
                    return;
                }

                pos += fallSpeed;
                food.style.top = pos + 'px';

                // Yere düşerse
                if (pos > window.innerHeight) {
                    clearInterval(food.fallInterval);
                    food.remove();
                    
                    missed++;
                    document.getElementById('missed').innerText = missed;
                    
                    if(missed >= 5) {
                        endGame();
                    }
                }
            }, 20);

            if(!isGameOver) {
                gameInterval = setTimeout(createFood, currentSpawnRate);
            }
        }

        // Oyunu Bitirme
        function endGame() {
            isGameOver = true;
            clearTimeout(gameInterval);
            clearInterval(difficultyInterval);
            
            document.getElementById('finalScore').innerText = score + " " + currentEmoji;
            showScreen('gameOver');
        }

        // Menüye Dön
        function backToMenu() {
            isGameOver = true;
            clearTimeout(gameInterval);
            clearInterval(difficultyInterval);
            document.querySelectorAll('.food-item').forEach(item => item.remove());
            showScreen('mainMenu');
        }
    </script>
</body>
</html>
